name: MoonBit CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify native build tools on Linux
        if: runner.os == 'Linux'
        run: gcc --version

      - name: Install native build tools on macOS
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Install MoonBit stable on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit stable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install C toolchain on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Show toolchain
        run: moon version --all

      - name: Format and generated interface check
        run: |
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Native coverage and CLI smoke test
        if: runner.os == 'Linux'
        run: |
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary
          moon run --target native cmd/main
          moon run --target native --release cmd/bench

      - name: Ensure generated files are committed
        run: git diff --exit-code
